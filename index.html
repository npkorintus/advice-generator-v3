<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Advice Generator</title>

  <link rel="icon" type="image/png" href="/assets/favicon/favicon-32x32.png" />
  <link rel="preload" href="/assets/fonts/manrope-v20-latin-800.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/styles.css" />

  <script src="/js/main.js" defer></script>
</head>

<body>

  <main id="root">
    <article class="advice-card">
      <div class="card-content">
        <p id="adviceId" class="id"></p>
        <h1 id="adviceText" class="advice"></h1>

        <div class="divider">
          <picture>
            <source srcset="assets/images/pattern-divider-mobile.svg" media="(max-width: 768px)" />
            <source srcset="assets/images/pattern-divider-desktop.svg" media="(min-width: 769px)" />
            <img src="assets/images/pattern-divider-desktop.svg" alt="divider" />
          </picture>
        </div>
      </div>

      <button id="adviceButton" class="getAdvice icon-button">
        <img class="dice-img" src="assets/images/icon-dice.svg" alt="dice-icon" />
      </button>

    </article>
  </main>

  <footer class="attribution">
    <p>
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank" rel="noreferrer">Frontend
        Mentor</a>. Coded by <a href="https://www.frontendmentor.io/profile/npkorintus">Nick Korintus</a>.
    </p>
  </footer>
</body>

</html>
